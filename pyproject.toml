[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Overriding setting DATABASES can lead to unexpected behavior.:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["config", "quizforger"]
omit = ["*/migrations/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["quizforger/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "DJ", "I", "S", "UP"]
ignore = [
  "DJ001", # Nullable ownership is intentional for legacy/guest records.
  "S101",  # Assertions are expected in tests.
]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501", "S105"]
"quizforger/language.py" = ["E501"]
"quizforger/tests/**/*.py" = ["S105", "S106"]
