name: Bug report
description: Report a reproducible QuizForger problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
  - type: dropdown
    attributes:
      label: Browser
      options: [Chrome, Firefox, Safari, Edge, Other]
  - type: textarea
    attributes:
      label: Relevant logs
      description: Remove email addresses, cookies, tokens, quiz answers, and other personal data.
